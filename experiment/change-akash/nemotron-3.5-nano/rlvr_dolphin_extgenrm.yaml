# =============================================================================
# Nemotron 3.5 Nano — RLVR single-controller, FULL SCALE, EXTERNAL GenRM
# =============================================================================
# Identical to rlvr_dolphin.yaml except GenRM is served by the external pool
# used by the legacy control. The launcher supplies the allocation-specific URL.
#
# Deep-merged onto the inherited in-cluster genrm_model block: setting
# base_url makes Gym's LocalVLLMModel skip the local vLLM launch entirely, so
# the inherited vllm_serve_* keys are inert. `model` must equal the pool's
# --served-model-name ("model" in genrm_worker.sh). The launcher re-overrides
# base_url via GENRM_BASE_URL at submit time.
#
# The GBS512 training allocation uses 16 nodes: 8 train, 4 policy-generation,
# and 4 Gym nodes. GenRM service nodes are separate.
# =============================================================================
defaults: rlvr_dolphin.yaml

env:
  nemo_gym:
    genrm_model:
      responses_api_models:
        genrm_model:
          base_url: null
          model: "model"
